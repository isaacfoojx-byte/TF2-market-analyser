name: Update TF2 item images
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    env: { STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }} }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install requests
      - run: python scripts/update_item_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/item_images.json
          git diff --cached --quiet || (git commit -m "update TF2 item images" && git push)
