name: Update TF2 item image catalogue

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-content-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Build item image catalogue
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: python scripts/update_item_images.py

      - name: Commit item image catalogue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/item_images.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "update TF2 visual catalogues"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
