name: Manual market scrape

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-market-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Configure output directory
        run: echo "OUTPUT_DIR=$RUNNER_TEMP/tf2-market-output" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Chrome
        run: google-chrome --version

      - name: Scrape and clean market data
        shell: bash
        run: |
          set -o pipefail
          python -m scraper.main 2>&1 | tee "$RUNNER_TEMP/scraper.log"

      - name: Validate generated snapshots
        run: python scripts/validate_scrape_output.py "$OUTPUT_DIR"

      - name: Commit snapshots to repository archive
        shell: bash
        run: |
          mkdir -p data/raw data/processed/archive
          cp "$OUTPUT_DIR"/raw/*.csv data/raw/
          cp "$OUTPUT_DIR"/processed/archive/*.csv data/processed/archive/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw/*.csv data/processed/archive/*.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "archive market snapshot ${{ github.run_id }}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload snapshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf2-market-scrape-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tf2-market-output/raw/*.csv
            ${{ runner.temp }}/tf2-market-output/processed/archive/*.csv
            ${{ runner.temp }}/tf2-market-output/diagnostics/*
            ${{ runner.temp }}/scraper.log
            chromedriver.log
            generated/metadata.json
          if-no-files-found: warn
          retention-days: 14
