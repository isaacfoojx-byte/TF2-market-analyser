name: Daily market update

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-content-writes
  cancel-in-progress: false

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Configure output directory
        run: echo "OUTPUT_DIR=$RUNNER_TEMP/tf2-market-output" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify configuration
        env:
          BACKPACK_TF_API_KEY: ${{ secrets.BACKPACK_TF_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        shell: bash
        run: |
          test -n "$BACKPACK_TF_API_KEY"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          test -n "$GOOGLE_SPREADSHEET_ID"

      - name: Fetch and clean market data
        env:
          BACKPACK_TF_API_KEY: ${{ secrets.BACKPACK_TF_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python -m scraper.scraping 2>&1 | tee "$RUNNER_TEMP/scraper.log"

      - name: Validate generated snapshots
        run: python scripts/validate_scrape_output.py "$OUTPUT_DIR"

      - name: Commit snapshots to repository
        shell: bash
        run: |
          mkdir -p data/raw data/processed
          cp "$OUTPUT_DIR"/raw/*.csv data/raw/
          cp "$OUTPUT_DIR"/processed/*.csv data/processed/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw/*.csv data/processed/*.csv generated/metadata.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "market snapshot ${{ github.run_id }}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload daily snapshot to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        shell: bash
        run: |
          processed_csv="$(find "$OUTPUT_DIR/processed" -maxdepth 1 -type f -name 'cleaned_*.csv' | sort | tail -n 1)"
          test -n "$processed_csv"
          python -m integrations.google_sheets "$processed_csv"

      - name: Archive snapshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf2-market-update-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tf2-market-output/raw/*.csv
            ${{ runner.temp }}/tf2-market-output/processed/*.csv
            ${{ runner.temp }}/tf2-market-output/diagnostics/*
            ${{ runner.temp }}/scraper.log
            chromedriver.log
            generated/metadata.json
          if-no-files-found: warn
          retention-days: 14
